<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анатомия · Спланхнология · Тест (102 вопроса)</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:14px 20px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:18px}
  header .sub{font-size:13px;opacity:.85;margin-top:4px}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:16px;position:sticky;top:74px;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.05)}
  .toolbar .progress{flex:1;min-width:160px}
  .bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .25s}
  .toolbar small{color:var(--muted);white-space:nowrap}
  button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#1d4ed8}
  .btn-ghost{background:#eef2ff;color:#1e3a8a}
  .btn-ghost:hover{background:#e0e7ff}
  .btn-danger{background:#fee2e2;color:#991b1b}
  .btn-danger:hover{background:#fecaca}
  .btn-answer{background:#f59e0b;color:#fff;margin-top:10px;padding:8px 16px;font-size:13.5px}
  .btn-answer:hover{background:#d97706}
  .btn-answer:disabled{background:#cbd5e1;cursor:default}
  .section{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.04)}
  .section>summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;font-size:15px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
  .section>summary::-webkit-details-marker{display:none}
  .section>summary .badge{font-size:12px;font-weight:600;color:#1e40af;background:#dbeafe;padding:2px 8px;border-radius:99px}
  .q{padding:14px 16px;border-bottom:1px solid #f1f5f9}
  .q:last-child{border-bottom:0}
  .q .title{font-weight:600;margin-bottom:8px}
  .q .title .num{color:var(--muted);font-weight:700;margin-right:6px}
  label.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:9px;cursor:pointer;transition:.12s;border:1px solid transparent}
  label.opt:hover{background:#f8fafc;border-color:#e2e8f0}
  label.opt input{margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
  label.opt.correct{background:#f0fdf4;border-color:#bbf7d0}
  label.opt.wrong{background:#fef2f2;border-color:#fecaca}
  label.opt.disabled{cursor:default}
  .feedback{margin-top:8px;font-size:13.5px;padding:8px 10px;border-radius:8px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .feedback.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .result{display:none;margin-top:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05)}
  .result.show{display:block}
  .result h2{margin:0 0 6px;font-size:22px}
  .result .score{font-size:34px;font-weight:800;color:#1d4ed8}
  .result .msg{color:var(--muted);margin-top:6px}
  .result .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
  .result .cell{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px}
  .result .cell b{display:block;font-size:18px}
  .totop{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(37,99,235,.4);z-index:20;border:0}
  .totop.show{display:flex}
  @media(max-width:600px){.toolbar{top:0;border-radius:0;margin:-1px -18px 16px;padding:12px 18px}.q{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>Анатомия · Спланхнология — тест</h1>

</header>
<div class="wrap">
  <div class="toolbar">

      <div class="cell">Частично<b id="rPart">0</b></div>
      <div class="cell">Неверно<b id="rWrong">0</b></div>

  </div>
</div>
<button class="totop" id="totop" title="Наверх">↑</button>

    let html=`<div class="title"><span class="num">${si+1}.${qi+1}</span>${q.q}</div>`;
    q.opts.forEach((opt,oi)=>{
      html+=`<label class="opt"><input type="checkbox" data-si="${si}" data-qi="${qi}" data-oi="${oi}"><span>${opt}</span></label>`;
    });
    html+=`<button class="btn-answer">Ответить</button><div class="feedback"></div>`;
    block.innerHTML=html;
    det.appendChild(block);
  });
  quiz.appendChild(det);
});

const allBoxes=[...document.querySelectorAll('input[type=checkbox]')];
const answeredSet=new Set();
const checkedCount=()=>answeredSet.size;
const updateProgress=()=>{const d=checkedCount();const p=totalQ?Math.round(d/totalQ*100):0;document.getElementById('bar').style.width=p+'%';document.getElementById('progressText').textContent=`Отвечено: ${d} из ${totalQ}`;};

function evaluate(si,qi,revealAll=false){
  const key=si+'-'+qi;
  if(answeredSet.has(key) && !revealAll) return null;
  const q=DATA[si].questions[qi];
  const block=document.querySelector(`.q[data-si="${si}"][data-qi="${qi}"]`);
  const boxes=[...block.querySelectorAll('input[type=checkbox]')];
  const chosen=boxes.map((b,i)=>b.checked?i:-1).filter(i=>i>=0);
  if(chosen.length===0 && !revealAll) return null;
  const correctSet=new Set(q.correct);
  const isCorrect=chosen.length===q.correct.length && chosen.every(i=>correctSet.has(i));
  const isPartial=!isCorrect && chosen.some(i=>correctSet.has(i));
  boxes.forEach((b,i)=>{
    b.parentElement.classList.remove('correct','wrong','disabled');
    if(correctSet.has(i)) b.parentElement.classList.add('correct');
    else if(b.checked) b.parentElement.classList.add('wrong');
    b.disabled=true; b.parentElement.classList.add('disabled');
  });
  const btn=block.querySelector('.btn-answer');
  btn.disabled=true; btn.textContent='Проверено';
  const fb=block.querySelector('.feedback');
  fb.className='feedback show '+(isCorrect?'ok':'bad');
  const correctText=q.correct.map(i=>q.opts[i]).join('; ');
  fb.innerHTML=isCorrect?'✅ Верно!':`❌ Неверно. Правильный ответ: <b>${correctText}</b>`;
  answeredSet.add(key); updateProgress();
  return {isCorrect,isPartial};
}

document.querySelectorAll('.btn-answer').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const block=btn.closest('.q');
    evaluate(+block.dataset.si,+block.dataset.qi,false);
  });
});

document.getElementById('checkAll').addEventListener('click',()=>{
  let full=0,part=0,wrong=0;
  DATA.forEach((sec,si)=>sec.questions.forEach((q,qi)=>{
    const r=evaluate(si,qi,true);
    if(!r){return;}
    if(r.isCorrect)full++;else if(r.isPartial)part++;else wrong++;
  }));
  const answered=answeredSet.size;
  const pct=answered?Math.round(full/answered*100):0;
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('rTotal').textContent=totalQ;
  document.getElementById('rFull').textContent=full;
  document.getElementById('rPart').textContent=part;
  document.getElementById('rWrong').textContent=wrong;
  document.getElementById('scoreMsg').textContent=
    `Проверено ${answered} из ${totalQ}. `+
    (pct>=90?'Отлично! Материал усвоен.':pct>=70?'Хорошо, но есть что повторить.':pct>=50?'Удовлетворительно — повторите слабые темы.':'Нужно повторить материал.');
  document.getElementById('result').classList.add('show');
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
});

document.getElementById('showAll').addEventListener('click',()=>{
  DATA.forEach((sec,si)=>sec.questions.forEach((q,qi)=>evaluate(si,qi,true)));
});
document.getElementById('resetAll').addEventListener('click',()=>location.reload());
document.getElementById('totop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
window.addEventListener('scroll',()=>document.getElementById('totop').classList.toggle('show',window.scrollY>400));
updateProgress();
</script>
</body>
</html>
